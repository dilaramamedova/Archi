<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qeydiyyatdan keç — ARCHİ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- archi.css hələ lazımdır: inject olunan navbar/footer onun class-larından istifadə edir. -->
<link rel="stylesheet" href="archi.css">
<!-- Tailwind — sıra vacibdir: tema Tailwind compiler-indən ƏVVƏL DOM-a düşməlidir. -->
<script src="archi-tw.js"></script>
<script src="tailwind-browser.js"></script>
</head>
<body>

<div data-archi="nav"></div>

<section class="bg-gray-soft2 py-14">
  <div class="mx-auto max-w-[760px] px-7">
    <div class="flex flex-col gap-7 border border-black/12 bg-white p-10 shadow-[-4px_4px_4px_rgba(0,0,0,0.05)] max-[640px]:p-6">
      <div class="flex flex-col gap-2">
        <div class="flex items-center gap-3">
          <span class="h-1 w-8 rounded-[2px] bg-yellow"></span>
          <p class="text-[13px] font-medium tracking-[1.4px] text-black/55 uppercase">ARCHİ-yə qoşul</p>
        </div>
        <h1 class="text-[32px] font-semibold tracking-[-0.4px] text-black/90 max-[640px]:text-[26px]">Qeydiyyatdan keç</h1>
        <p class="text-base leading-[1.5] text-black/55">Hesab növünü seç — alıcı, satıcı, yoxsa usta/mütəxəssis kimi davam et.</p>
      </div>

      <div class="hidden border border-green bg-[#eafce9] px-4 py-3.5 text-[15px] text-[#0a7a14]" id="okMsg">Qeydiyyat uğurla tamamlandı! (demo — backend qoşulmayıb)</div>

      <!-- Rol seçimi — seçili vəziyyət data-sel atributu + Tailwind group-data variantları ilə -->
      <div>
        <div class="mb-3 text-base font-semibold text-black">Hesab növü</div>
        <div class="grid grid-cols-3 gap-3 max-[640px]:grid-cols-1" id="roles">
          <button type="button" class="group relative flex cursor-pointer flex-col gap-2.5 border border-black/20 p-5 text-left transition-[border-color,background] duration-200 hover:border-black data-[sel=true]:border-yellow data-[sel=true]:bg-[#fffdf0] data-[sel=true]:shadow-[inset_0_0_0_1px_var(--color-yellow)]" data-role="alici">
            <span class="absolute top-3.5 right-3.5 flex size-5 items-center justify-center rounded-full border border-black/30 opacity-0 transition duration-200 group-data-[sel=true]:border-yellow group-data-[sel=true]:bg-yellow group-data-[sel=true]:opacity-100"><img class="size-3 brightness-0" src="assets/ic-check.svg" alt=""></span>
            <span class="flex size-[46px] items-center justify-center rounded-pill bg-gray-soft group-data-[sel=true]:bg-yellow"><img class="size-6" src="assets/ic-cart.svg" alt=""></span>
            <h4 class="text-base font-semibold text-ink">Alıcı</h4>
            <p class="text-[13px] leading-[1.35] text-black/55">Material al, usta tap, sifariş ver.</p>
          </button>
          <button type="button" class="group relative flex cursor-pointer flex-col gap-2.5 border border-black/20 p-5 text-left transition-[border-color,background] duration-200 hover:border-black data-[sel=true]:border-yellow data-[sel=true]:bg-[#fffdf0] data-[sel=true]:shadow-[inset_0_0_0_1px_var(--color-yellow)]" data-role="satici">
            <span class="absolute top-3.5 right-3.5 flex size-5 items-center justify-center rounded-full border border-black/30 opacity-0 transition duration-200 group-data-[sel=true]:border-yellow group-data-[sel=true]:bg-yellow group-data-[sel=true]:opacity-100"><img class="size-3 brightness-0" src="assets/ic-check.svg" alt=""></span>
            <span class="flex size-[46px] items-center justify-center rounded-pill bg-gray-soft group-data-[sel=true]:bg-yellow"><img class="size-6" src="assets/spec-ic-sirket.svg" alt=""></span>
            <h4 class="text-base font-semibold text-ink">Satıcı</h4>
            <p class="text-[13px] leading-[1.35] text-black/55">Məhsullarını yerləşdir və sat.</p>
          </button>
          <button type="button" class="group relative flex cursor-pointer flex-col gap-2.5 border border-black/20 p-5 text-left transition-[border-color,background] duration-200 hover:border-black data-[sel=true]:border-yellow data-[sel=true]:bg-[#fffdf0] data-[sel=true]:shadow-[inset_0_0_0_1px_var(--color-yellow)]" data-role="usta">
            <span class="absolute top-3.5 right-3.5 flex size-5 items-center justify-center rounded-full border border-black/30 opacity-0 transition duration-200 group-data-[sel=true]:border-yellow group-data-[sel=true]:bg-yellow group-data-[sel=true]:opacity-100"><img class="size-3 brightness-0" src="assets/ic-check.svg" alt=""></span>
            <span class="flex size-[46px] items-center justify-center rounded-pill bg-gray-soft group-data-[sel=true]:bg-yellow"><img class="size-6" src="assets/spec-ic-usta.svg" alt=""></span>
            <h4 class="text-base font-semibold text-ink">Usta / Mütəxəssis</h4>
            <p class="text-[13px] leading-[1.35] text-black/55">Xidmət göstər, müştəri qazan.</p>
          </button>
        </div>
      </div>

      <!-- Form -->
      <form class="flex flex-col gap-[18px]" id="regForm" onsubmit="return false">
        <div class="flex gap-3.5 max-[640px]:flex-col">
          <div class="flex flex-1 flex-col gap-2">
            <label class="text-sm font-medium text-black/70">Ad</label>
            <input class="border border-black/20 bg-white px-4 py-3.5 text-base text-black outline-none transition-[border-color] duration-200 placeholder:text-black/40 focus:border-black" type="text" placeholder="Adınız" required>
          </div>
          <div class="flex flex-1 flex-col gap-2">
            <label class="text-sm font-medium text-black/70">Soyad</label>
            <input class="border border-black/20 bg-white px-4 py-3.5 text-base text-black outline-none transition-[border-color] duration-200 placeholder:text-black/40 focus:border-black" type="text" placeholder="Soyadınız" required>
          </div>
        </div>

        <!-- satıcıya xas · [&[hidden]]:hidden lazımdır, çünki `flex` UA-nın [hidden] qaydasını üstələyir -->
        <div class="flex flex-col gap-2 [&[hidden]]:hidden" data-for="satici" hidden>
          <label class="text-sm font-medium text-black/70">Şirkət / marka adı</label>
          <input class="border border-black/20 bg-white px-4 py-3.5 text-base text-black outline-none transition-[border-color] duration-200 placeholder:text-black/40 focus:border-black" type="text" placeholder="Məsələn: ARCHI Build MMC">
        </div>

        <!-- ustaya xas -->
        <div class="flex gap-3.5 max-[640px]:flex-col [&[hidden]]:hidden" data-for="usta" hidden>
          <div class="flex flex-1 flex-col gap-2">
            <label class="text-sm font-medium text-black/70">İxtisas</label>
            <select class="border border-black/20 bg-white px-4 py-3.5 text-base text-black outline-none transition-[border-color] duration-200 focus:border-black">
              <option value="">Seçin</option>
              <option>Kafelçi</option><option>Elektrik</option><option>Santexnik</option>
              <option>Boyaçı</option><option>Gips-kartonçu</option><option>Memar</option>
              <option>İnteryer dizayner</option><option>Digər</option>
            </select>
          </div>
          <div class="flex flex-1 flex-col gap-2">
            <label class="text-sm font-medium text-black/70">Şəhər</label>
            <select class="border border-black/20 bg-white px-4 py-3.5 text-base text-black outline-none transition-[border-color] duration-200 focus:border-black">
              <option value="">Seçin</option>
              <option>Bakı</option><option>Sumqayıt</option><option>Gəncə</option>
              <option>Mingəçevir</option><option>Şirvan</option><option>Digər</option>
            </select>
          </div>
        </div>

        <div class="flex gap-3.5 max-[640px]:flex-col">
          <div class="flex flex-1 flex-col gap-2">
            <label class="text-sm font-medium text-black/70">E-poçt</label>
            <input class="border border-black/20 bg-white px-4 py-3.5 text-base text-black outline-none transition-[border-color] duration-200 placeholder:text-black/40 focus:border-black" type="email" placeholder="email@example.com" required>
          </div>
          <div class="flex flex-1 flex-col gap-2">
            <label class="text-sm font-medium text-black/70">Telefon</label>
            <input class="border border-black/20 bg-white px-4 py-3.5 text-base text-black outline-none transition-[border-color] duration-200 placeholder:text-black/40 focus:border-black" type="tel" placeholder="+994 50 000 00 00" required>
          </div>
        </div>
        <div class="flex gap-3.5 max-[640px]:flex-col">
          <div class="flex flex-1 flex-col gap-2">
            <label class="text-sm font-medium text-black/70">Şifrə</label>
            <input class="border border-black/20 bg-white px-4 py-3.5 text-base text-black outline-none transition-[border-color] duration-200 placeholder:text-black/40 focus:border-black" type="password" placeholder="Ən azı 6 simvol" required>
          </div>
          <div class="flex flex-1 flex-col gap-2">
            <label class="text-sm font-medium text-black/70">Şifrəni təkrarla</label>
            <input class="border border-black/20 bg-white px-4 py-3.5 text-base text-black outline-none transition-[border-color] duration-200 placeholder:text-black/40 focus:border-black" type="password" placeholder="Şifrəni təkrarla" required>
          </div>
        </div>

        <label class="flex items-center gap-2.5 text-sm text-black/70"><input class="size-[18px] accent-yellow" type="checkbox" required> <span><a class="border-b border-yellow-line" href="#">İstifadə şərtləri</a> və <a class="border-b border-yellow-line" href="#">Məxfilik siyasəti</a> ilə razıyam</span></label>

        <button class="h-[54px] cursor-pointer border-none bg-yellow text-lg font-semibold text-ink transition-[filter] duration-200 hover:brightness-[.93]" type="submit">Qeydiyyatdan keç</button>
        <p class="text-center text-[15px] text-black/60">Artıq hesabın var? <a class="border-b-2 border-yellow-line font-semibold text-ink" href="login.html" data-login>Daxil ol</a></p>
      </form>
    </div>
  </div>
</section>

<div data-archi="footer"></div>

<script>
  const roles = document.querySelectorAll('[data-role]');
  function pick(role){
    roles.forEach(r=>{ r.dataset.sel = String(r.dataset.role === role); });
    document.querySelectorAll('[data-for]').forEach(el=>{ el.hidden = (el.dataset.for !== role); });
  }
  roles.forEach(r=>r.addEventListener('click',()=>pick(r.dataset.role)));

  // ?role= ilə öncədən seç (default: alıcı)
  const want=new URLSearchParams(location.search).get('role');
  pick(['alici','satici','usta'].includes(want)?want:'alici');

  document.getElementById('regForm').addEventListener('submit',()=>{
    try{ localStorage.setItem('archi-auth','1'); }catch(e){}
    document.getElementById('okMsg').classList.remove('hidden');
    window.scrollTo({top:0,behavior:'smooth'});
  });
</script>
<script src="archi.js"></script>
</body>
</html>
