<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ətraflı təmir kalkulyatoru — ARCHİ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="archi.css">
<style>
  .dc-page{background:var(--gray-soft2);padding:40px 0 80px}
  .dc-page>.inner{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:24px}
  .dc-head .tag{display:flex;align-items:center;gap:10px}
  .dc-head .tag .line{width:28px;height:4px;border-radius:4px;background:var(--yellow-line)}
  .dc-head .tag p{font-weight:600;font-size:12px;letter-spacing:1px;color:rgba(0,0,0,.5);text-transform:uppercase}
  .dc-head h1{font-weight:700;font-size:30px;color:#111;letter-spacing:-.4px;margin-top:8px}
  .dc-head .sub{font-size:15px;color:rgba(0,0,0,.5);margin-top:6px}
  /* stepper */
  .dc-stepper{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:4px;padding:16px 20px;overflow-x:auto}
  .dc-step{display:flex;align-items:center;gap:8px;white-space:nowrap}
  .dc-step .c{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;background:#e6e8eb;color:rgba(0,0,0,.5);flex-shrink:0}
  .dc-step.done .c{background:var(--yellow-line);color:#111}
  .dc-step.active .c{background:#111;color:#fff}
  .dc-step .l{font-weight:500;font-size:14px;color:rgba(0,0,0,.5)}
  .dc-step.done .l,.dc-step.active .l{color:#111}
  .dc-step.active .l{font-weight:700}
  .dc-conn{flex:1;height:2px;background:#e0e2e5;margin:0 10px;min-width:16px}
  /* body */
  .dc-body{display:grid;grid-template-columns:1fr 370px;gap:24px;align-items:start}
  .dc-main{background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:4px;padding:28px;display:flex;flex-direction:column;gap:20px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
  .dc-sh .k{font-weight:600;font-size:13px;color:#8c7f0d}
  .dc-sh h2{font-weight:700;font-size:22px;color:#111;margin-top:4px}
  .dc-sh .d{font-size:14px;color:rgba(0,0,0,.5);margin-top:4px}
  .dc-group{display:flex;flex-direction:column;gap:10px}
  .dc-group>label{font-weight:600;font-size:13px;color:#111}
  .dc-chips{display:flex;flex-wrap:wrap;gap:8px}
  .dc-chip{padding:9px 14px;border-radius:4px;border:1px solid rgba(0,0,0,.1);background:#fff;font-weight:500;font-size:13px;color:rgba(0,0,0,.7);cursor:pointer;transition:all .15s}
  .dc-chip:hover{border-color:rgba(0,0,0,.35)} .dc-chip.on{background:#111;border-color:#111;color:#fff;font-weight:600}
  .dc-fields{display:flex;gap:14px;flex-wrap:wrap}
  .dc-fb{flex:1;min-width:120px;display:flex;flex-direction:column;gap:6px}
  .dc-fb>span{font-weight:600;font-size:13px;color:#111}
  .dc-fb .ip{display:flex;align-items:center;gap:4px;border:1px solid rgba(0,0,0,.14);border-radius:4px;padding:11px 14px}
  .dc-fb .ip:focus-within{border-color:#111}
  .dc-fb .ip input{border:none;outline:none;width:100%;font-size:15px;font-weight:700;color:#111;background:none;font-family:inherit}
  .dc-fb .ip .u{font-size:12px;color:rgba(0,0,0,.5)}
  .dc-toggles{display:flex;gap:12px;flex-wrap:wrap}
  .dc-tg{flex:1;min-width:180px;display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid rgba(0,0,0,.1);border-radius:4px;padding:13px 14px;cursor:pointer;background:#fff}
  .dc-tg span{font-weight:500;font-size:13px;color:#111}
  .dc-sw{width:44px;height:24px;border-radius:12px;background:#d9dbde;position:relative;flex-shrink:0;transition:background .2s}
  .dc-sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s}
  .dc-tg.on .dc-sw{background:var(--yellow-line)} .dc-tg.on .dc-sw::after{left:23px}
  .dc-tg.grn.on .dc-sw{background:#4caf50}
  /* rooms */
  .dc-room{border:1px solid rgba(0,0,0,.1);border-radius:4px;padding:18px;display:flex;flex-direction:column;gap:14px}
  .dc-room.exp{background:#fdfdf4;border:1.5px solid var(--yellow-line)}
  .dc-room-h{display:flex;align-items:center;justify-content:space-between}
  .dc-room-h b{font-weight:700;font-size:16px;color:#111}
  .dc-room-h .rm{font-weight:500;font-size:13px;color:#c0392b;cursor:pointer;background:none;border:none;font-family:inherit}
  .dc-collapsed{display:flex;align-items:center;justify-content:space-between;border:1px solid rgba(0,0,0,.1);border-radius:4px;padding:16px 18px;cursor:pointer}
  .dc-collapsed b{font-weight:600;font-size:15px;color:#111} .dc-collapsed .a{font-weight:500;font-size:13px;color:rgba(0,0,0,.5);margin-left:8px}
  .dc-add{display:flex;align-items:center;justify-content:center;gap:8px;padding:14px;border-radius:4px;border:1px dashed rgba(0,0,0,.28);font-weight:600;font-size:14px;color:rgba(0,0,0,.6);cursor:pointer;background:none;font-family:inherit}
  .dc-add:hover{border-color:#111;color:#111}
  /* works checklist */
  .dc-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .dc-wr{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid rgba(0,0,0,.1);border-radius:4px;padding:12px 14px;cursor:pointer;background:#fff}
  .dc-wr.on{background:#fdfdf4;border:1.5px solid var(--yellow-line)}
  .dc-wr .lft{display:flex;align-items:center;gap:10px}
  .dc-cb{width:20px;height:20px;border-radius:4px;border:1px solid rgba(0,0,0,.3);background:#fff;flex-shrink:0;display:flex;align-items:center;justify-content:center}
  .dc-wr.on .dc-cb{background:#111;border-color:#111;color:#fff}
  .dc-cb svg{width:12px;height:12px;display:none} .dc-wr.on .dc-cb svg{display:block}
  .dc-wr .nm{font-weight:500;font-size:14px;color:rgba(0,0,0,.75)} .dc-wr.on .nm{font-weight:600;color:#111}
  .dc-wr .pr{font-weight:600;font-size:13px;color:rgba(0,0,0,.5)} .dc-wr.on .pr{color:#111}
  /* material rows */
  .dc-mr{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid rgba(0,0,0,.1);border-radius:4px;padding:16px}
  .dc-mr .ml b{font-weight:600;font-size:14px;color:#111;display:block}
  .dc-mr .ml span{font-size:13px;color:rgba(0,0,0,.5)} .dc-mr .ml span.no{color:#b7791f}
  .dc-mr .mr-r{display:flex;align-items:center;gap:12px}
  .dc-mr .price{font-weight:700;font-size:14px;color:#111}
  .dc-badge{padding:4px 9px;border-radius:4px;font-weight:600;font-size:11px;background:#fff8cc;background:#fff8cc;color:#8c7f0d}
  .dc-pick{padding:9px 14px;border-radius:4px;border:1px solid #111;background:#fff;font-weight:600;font-size:13px;color:#111;cursor:pointer;font-family:inherit}
  .dc-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--yellow-line);border-radius:4px;background:#fffdf0;padding:16px 18px}
  .dc-banner b{font-weight:600;font-size:14px;color:#111}
  /* cart rows */
  .dc-cart-row{display:flex;align-items:center;gap:14px;border:1px solid rgba(0,0,0,.1);border-radius:4px;padding:16px}
  .dc-cart-row .cbx{width:22px;height:22px;border-radius:4px;background:#4caf50;color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer}
  .dc-cart-row.off .cbx{background:#fff;border:1px solid rgba(0,0,0,.3)}
  .dc-cart-row.off{opacity:.55}
  .dc-cart-row .cbx svg{width:13px;height:13px} .dc-cart-row.off .cbx svg{display:none}
  .dc-thumb{width:54px;height:54px;border-radius:4px;background:#eceef1;flex-shrink:0}
  .dc-cart-row .info{flex:1;min-width:0} .dc-cart-row .info b{font-weight:600;font-size:15px;color:#111;display:block}
  .dc-cart-row .info .meta{font-size:13px;color:rgba(0,0,0,.5)} .dc-cart-row .info .calc{font-size:13px;color:#3d7a4a;margin-top:2px}
  .dc-cart-row .rr{text-align:right} .dc-cart-row .rr .p{font-weight:700;font-size:15px;color:#111}
  .dc-stock{display:inline-block;margin-top:4px;padding:3px 9px;border-radius:4px;font-weight:600;font-size:11px;background:#e6f6e9;color:#237a37}
  .dc-stock.ord{background:#fff2d9;color:#8a6d1b}
  /* sidebar */
  .dc-side{position:sticky;top:20px;display:flex;flex-direction:column;gap:16px}
  .dc-sum{background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:4px;padding:24px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
  .dc-sum .lbl{font-weight:600;font-size:13px;color:rgba(0,0,0,.5)}
  .dc-sum .big{display:flex;align-items:baseline;gap:6px} .dc-sum .big b{font-weight:700;font-size:32px;color:#111} .dc-sum .big span{font-weight:600;font-size:15px;color:rgba(0,0,0,.5)}
  .dc-sum .rows{display:flex;flex-direction:column;gap:9px;border-top:1px solid rgba(0,0,0,.08);padding-top:12px}
  .dc-sum .rows .r{display:flex;justify-content:space-between;font-size:14px;color:rgba(0,0,0,.6)} .dc-sum .rows .r b{font-weight:600;color:#111}
  .dc-nav{display:flex;gap:12px}
  .dc-back{padding:14px 24px;border-radius:4px;border:1px solid rgba(0,0,0,.15);background:#fff;font-weight:600;font-size:15px;color:#111;cursor:pointer;font-family:inherit}
  .dc-next{flex:1;padding:14px;border-radius:4px;border:none;background:var(--yellow);font-weight:600;font-size:15px;color:#111;cursor:pointer;font-family:inherit;transition:filter .2s}
  .dc-next:hover{filter:brightness(.93)}
  /* result */
  .dc-bd{display:flex;flex-direction:column;gap:14px}
  .dc-bd .row .top{display:flex;justify-content:space-between;font-size:14px;margin-bottom:6px} .dc-bd .row .top .l{color:rgba(0,0,0,.75);font-weight:500} .dc-bd .row .top .v{font-weight:700;color:#111}
  .dc-bar{height:8px;border-radius:4px;background:#e9edf1;overflow:hidden} .dc-bar i{display:block;height:8px;border-radius:4px;background:#d1d5db}
  .dc-bar.hi i{background:var(--yellow-line)}
  .dc-total{display:flex;align-items:baseline;justify-content:space-between;border-top:1px solid rgba(0,0,0,.1);padding-top:16px;margin-top:4px}
  .dc-total b{font-weight:700;font-size:18px;color:#111} .dc-total .v b{font-size:30px} .dc-total .v span{font-size:15px;color:rgba(0,0,0,.5);margin-left:4px}
  .dc-tips{display:flex;flex-direction:column;gap:10px}
  .dc-tip{display:flex;gap:10px;background:#eef7f0;border-radius:4px;padding:12px}
  .dc-tip .d{width:18px;height:18px;border-radius:50%;background:#2f9e44;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .dc-tip .t1{font-size:13px;color:#2b3a2e} .dc-tip .t2{font-weight:700;font-size:13px;color:#1b6b2e}
  .dc-act{display:flex;flex-direction:column;gap:10px}
  .dc-sec{display:flex;gap:8px} .dc-sec button{flex:1;padding:12px;border-radius:4px;border:1px solid rgba(0,0,0,.1);background:#fff;font-weight:500;font-size:13px;color:#111;cursor:pointer;font-family:inherit}
  .dc-outline{padding:14px;border-radius:4px;border:1.5px solid #111;background:#fff;font-weight:600;font-size:15px;color:#111;cursor:pointer;font-family:inherit}
  @media(max-width:900px){ .dc-body{grid-template-columns:1fr} .dc-side{position:static} .dc-cols{grid-template-columns:1fr} }
</style>
</head>
<body>

<div data-archi="nav"></div>

<section class="dc-page">
  <div class="inner">
    <div class="dc-head">
      <div class="tag"><span class="line"></span><p>Ətraflı kalkulyator</p></div>
      <h1>Dəqiq təmir smetası hazırlayın</h1>
      <div class="sub">Otaqları, işləri və materialları seçin — səbətdəki məhsullar da hesablamaya daxil edilir.</div>
    </div>

    <div class="dc-stepper" id="dcStepper"></div>

    <div class="dc-body">
      <div class="dc-main" id="dcMain"></div>
      <aside class="dc-side" id="dcSide"></aside>
    </div>
  </div>
</section>

<div data-archi="footer"></div>

<svg style="display:none"><symbol id="chk" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>

<script>
const STEPS=["Obyekt","Otaqlar","İşlər","Materiallar","Səbət","Yekun"];
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
const CHK='<svg><use href="#chk"/></svg>';

// ---- default cart (localStorage 'archi-cart' + fallback demo) ----
function loadCart(){
  let c=[]; try{ c=JSON.parse(localStorage.getItem('archi-cart')||'[]'); }catch(e){}
  if(!Array.isArray(c)||!c.length){
    c=[
      {name:"Quick-Step laminat, 32-ci sinif",brand:"Quick-Step",cat:"Döşəmə",calc:"80 m² + 10% = 88 m² → 22 paket",price:1840,stock:"Stokda var",inStock:true},
      {name:"Metlax kafel 20×20",brand:"Marca Corona",cat:"Kafel & metlax",calc:"32 m² + 15% = 37 m² → 26 qutu",price:765,stock:"Stokda var",inStock:true},
      {name:"Caparol mat divar boyası",brand:"Caparol",cat:"Boya",calc:"2 qat · 120 m² → 12 vedrə",price:420,stock:"Stokda var",inStock:true},
      {name:"MDF qapı, ağ",brand:"Portalux",cat:"Qapılar",calc:"5 otaq → 5 ədəd",price:2000,stock:"Sifarişlə 3-5 gün",inStock:false},
      {name:"Asma unitaz, komplekt",brand:"Roca",cat:"Santexnika",calc:"2 sanitar → 2 ədəd",price:640,stock:"Stokda var",inStock:true},
      {name:"Qarışdırıcı, xrom",brand:"Grohe",cat:"Santexnika",calc:"3 nöqtə → 3 ədəd",price:390,stock:"Stokda var",inStock:true}
    ];
  }
  return c.map(x=>({included:true,...x}));
}

let saved={}; try{ saved=JSON.parse(localStorage.getItem('archi-quickcalc')||'{}'); }catch(e){}
const state={
  step:0,
  obj:1, objV:"Mənzil", area:saved.area||80, city:"Bakı", floor:"7 / 16",
  prop:"Yeni tikili", cond:"Təmirsiz",
  design:false, drawings:false, demolition:true,
  rooms:[
    {name:"Qonaq otağı",area:24,h:2.9,per:20,doors:1,win:2,floor:"Laminat",wall:"Boya",heat:true},
    {name:"Mətbəx",area:12,h:2.9,per:16,doors:1,win:1,floor:"Kafel",wall:"Boya",heat:false},
    {name:"Hamam otağı",area:6,h:2.7,per:11,doors:1,win:0,floor:"Kafel",wall:"Kafel",heat:true}
  ],
  editRoom:0,
  works:{},
  useCart:true,
  cart:loadCart(),
  services:{}
};

const WORKS=[
  ["Demontaj",8,"m²",true],["Divarların hamarlanması",14,"m²",true],["Suvaq",11,"m²",true],
  ["Şpaklyovka",9,"m²",true],["Döşəmə styaşkası",13,"m²",true],["Hidroizolyasiya",10,"m²",false],
  ["Səs izolyasiyası",16,"m²",false],["Elektrik işləri",28,"nöqtə",true],["Santexnika",35,"nöqtə",true],
  ["Ventilyasiya",22,"m²",false],["Kondisioner sistemi",180,"əd",false],["Kafel üçün hazırlıq",12,"m²",true],["Boya üçün hazırlıq",7,"m²",true]
];
WORKS.forEach((w,i)=>{ if(state.works[i]===undefined) state.works[i]=w[3]; });

const SERVICES=[["Dizayn layihəsi",2400],["Müəllif nəzarəti",1500],["Komplektləşdirmə",800],["Klininq",300]];

// ---------- COMPUTE ----------
function totalArea(){ return state.rooms.reduce((s,r)=>s+(+r.area||0),0)||state.area; }
function bathrooms(){ return state.rooms.filter(r=>/hamam|sanitar/i.test(r.name)).length||1; }
function worksCost(){
  const A=totalArea(), pts=Math.max(1,Math.round(A/8));
  let s=0; WORKS.forEach((w,i)=>{ if(!state.works[i])return; const [n,p,u]=w; s+= u==="m²"? p*A : u==="nöqtə"? p*pts : p*1; });
  return s;
}
function cartTotal(){ return state.useCart? state.cart.filter(c=>c.included).reduce((s,c)=>s+(+c.price||0),0):0; }
function computeEstimate(){
  const A=totalArea();
  const cartByCat=c=>state.useCart? state.cart.filter(x=>x.included&&x.cat===c).reduce((s,x)=>s+x.price,0):0;
  const cartMat = state.useCart? state.cart.filter(c=>c.included&&["Döşəmə","Kafel & metlax","Boya"].includes(c.cat)).reduce((s,c)=>s+c.price,0):0;
  const qara = Math.round(A*150);
  const uzluk = cartMat || Math.round(A*280);
  const santex = (cartByCat("Santexnika")||0) + bathrooms()*1800;
  const elektrik = Math.round(A*52);
  const isiq = Math.round(A*44);
  const qapilar = (cartByCat("Qapılar")||0) + state.rooms.length*400;
  const isler = worksCost();
  const catdirilma = 2000;
  const extras = SERVICES.reduce((s,[n,p],i)=> s+(state.services[i]?p:0),0);
  const sub = qara+uzluk+santex+elektrik+isiq+qapilar+isler+catdirilma+extras;
  const reserve = Math.round(sub*0.10);
  const rows=[
    ["Qara təmir materialları",qara],["Üzlük materialları",uzluk],["Santexnika",santex],
    ["Elektrik",elektrik],["İşıqlandırma",isiq],["Qapılar",qapilar],["İşlər",isler],
    ["Çatdırılma və qaldırılma",catdirilma],["Əlavə xidmətlər",extras],["10% ehtiyat",reserve]
  ];
  return {rows,total:sub+reserve};
}

// ---------- RENDER ----------
const mainEl=document.getElementById('dcMain'), sideEl=document.getElementById('dcSide'), stepEl=document.getElementById('dcStepper');
function chips(key,opts){ return `<div class="dc-chips" data-key="${key}">`+opts.map(o=>`<button class="dc-chip ${state[key]===o?'on':''}" data-v="${o}">${o}</button>`).join('')+`</div>`; }

function renderStepper(){
  stepEl.innerHTML=STEPS.map((n,i)=>{
    const cls=i<state.step?'done':i===state.step?'active':'';
    const inner=`<div class="dc-step ${cls}" data-i="${i}"><div class="c">${i<state.step?'✓':i+1}</div><div class="l">${n}</div></div>`;
    return inner+(i<STEPS.length-1?'<div class="dc-conn"></div>':'');
  }).join('');
  stepEl.querySelectorAll('.dc-step').forEach(s=>s.addEventListener('click',()=>{ const i=+s.dataset.i; if(i<=state.step){ state.step=i; render(); } }));
}

function stepObyekt(){
  return `<div class="dc-sh"><div class="k">Addım 1 · Obyekt</div><h2>Obyekt haqqında məlumat</h2></div>
  <div class="dc-group"><label>Obyektin növü</label>${chips('objV',["Mənzil","Fərdi ev","Ofis","Kommersiya"])}</div>
  <div class="dc-fields">
    <div class="dc-fb"><span>Sahə</span><div class="ip"><input id="dcArea" type="number" value="${state.area}"><span class="u">m²</span></div></div>
    <div class="dc-fb"><span>Şəhər</span><div class="ip"><input id="dcCity" value="${state.city}"></div></div>
    <div class="dc-fb"><span>Mərtəbə</span><div class="ip"><input id="dcFloor" value="${state.floor}"></div></div>
  </div>
  <div class="dc-group"><label>Daşınmaz əmlakın növü</label>${chips('prop',["Yeni tikili","İkinci əl"])}</div>
  <div class="dc-group"><label>Obyektin vəziyyəti</label>${chips('cond',["Təmirsiz","Demontajdan sonra","Hazır qara təmir"])}</div>
  <div class="dc-group"><label>Əlavə parametrlər</label>
    <div class="dc-toggles">
      <div class="dc-tg ${state.design?'on':''}" data-t="design"><span>Dizayn layihəsi var</span><div class="dc-sw"></div></div>
      <div class="dc-tg ${state.drawings?'on':''}" data-t="drawings"><span>Çertyojlar var</span><div class="dc-sw"></div></div>
      <div class="dc-tg ${state.demolition?'on':''}" data-t="demolition"><span>Demontaj lazımdır</span><div class="dc-sw"></div></div>
    </div>
  </div>`;
}
function stepOtaqlar(){
  const rooms=state.rooms.map((r,i)=>{
    if(i===state.editRoom){
      return `<div class="dc-room exp"><div class="dc-room-h"><b>${r.name}</b><button class="rm" data-rm="${i}">Sil</button></div>
      <div class="dc-fields">
        <div class="dc-fb"><span>Döşəmə sahəsi</span><div class="ip"><input data-r="${i}" data-f="area" type="number" value="${r.area}"><span class="u">m²</span></div></div>
        <div class="dc-fb"><span>Tavan hünd.</span><div class="ip"><input data-r="${i}" data-f="h" type="number" value="${r.h}"><span class="u">m</span></div></div>
        <div class="dc-fb"><span>Divar perimetri</span><div class="ip"><input data-r="${i}" data-f="per" type="number" value="${r.per}"><span class="u">m</span></div></div>
        <div class="dc-fb"><span>Qapı</span><div class="ip"><input data-r="${i}" data-f="doors" type="number" value="${r.doors}"></div></div>
        <div class="dc-fb"><span>Pəncərə</span><div class="ip"><input data-r="${i}" data-f="win" type="number" value="${r.win}"></div></div>
      </div>
      <div class="dc-group"><label>Döşəmə örtüyü</label><div class="dc-chips" data-rk="floor" data-ri="${i}">${["Laminat","Parket","SPC","Kafel"].map(o=>`<button class="dc-chip ${r.floor===o?'on':''}" data-v="${o}">${o}</button>`).join('')}</div></div>
      <div class="dc-group"><label>Divar üzlüyü</label><div class="dc-chips" data-rk="wall" data-ri="${i}">${["Boya","Divar kağızı","Dekor suvaq","Kafel"].map(o=>`<button class="dc-chip ${r.wall===o?'on':''}" data-v="${o}">${o}</button>`).join('')}</div></div>
      <div class="dc-tg ${r.heat?'on':''}" data-rheat="${i}"><span>İsti döşəmə</span><div class="dc-sw"></div></div>
      </div>`;
    }
    return `<div class="dc-collapsed" data-open="${i}"><div><b>${r.name}</b><span class="a">· ${r.area} m²</span></div><span style="font-weight:500;font-size:13px;color:rgba(0,0,0,.5)">Redaktə et</span></div>`;
  }).join('');
  return `<div class="dc-sh"><div class="k">Addım 2 · Otaqlar</div><h2>Otaqları əlavə edin</h2><div class="d">Hər otaq üçün ölçüləri və üzlük növünü seçin.</div></div>
  ${rooms}<button class="dc-add" id="dcAddRoom">+  Otaq əlavə et</button>`;
}
function stepIsler(){
  const half=Math.ceil(WORKS.length/2);
  const col=(from,to)=>WORKS.slice(from,to).map((w,idx)=>{const i=from+idx;const on=state.works[i];return `<div class="dc-wr ${on?'on':''}" data-w="${i}"><div class="lft"><div class="dc-cb">${CHK}</div><div class="nm">${w[0]}</div></div><div class="pr">${w[1]} ₼/${w[2]}</div></div>`;}).join('');
  const sel=Object.values(state.works).filter(Boolean).length;
  return `<div class="dc-sh"><div class="k">Addım 3 · İşlər</div><h2>Lazım olan işləri seçin</h2><div class="d">Yalnız ehtiyacınız olan işləri işarələyin — qiymət avtomatik hesablanır.</div></div>
  <div class="dc-cols"><div style="display:flex;flex-direction:column;gap:10px">${col(0,half)}</div><div style="display:flex;flex-direction:column;gap:10px">${col(half,WORKS.length)}</div></div>
  <div style="display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid rgba(0,0,0,.1);padding-top:16px"><b style="font-weight:600;font-size:15px">Seçilmiş işlər (${sel})</b><span style="font-weight:700;font-size:22px">${fmt(worksCost())} <span style="font-size:14px;color:rgba(0,0,0,.5)">₼</span></span></div>`;
}
function stepMateriallar(){
  const cats=[["Döşəmə örtüyü","Döşəmə"],["Kafel & metlax","Kafel & metlax"],["Boya","Boya"],["Qapılar","Qapılar"],["Santexnika","Santexnika"],["İşıqlandırma",""]];
  const rows=cats.map(([label,cat])=>{
    const item=state.useCart? state.cart.find(c=>c.included&&c.cat===cat):null;
    if(item) return `<div class="dc-mr"><div class="ml"><b>${label}</b><span>${item.name} · ${item.calc.split('→').pop().trim()}</span></div><div class="mr-r"><span class="price">${fmt(item.price)} ₼</span><span class="dc-badge">Səbətdən</span></div></div>`;
    return `<div class="dc-mr"><div class="ml"><b>${label}</b><span class="no">Seçilməyib</span></div><div class="mr-r"><button class="dc-pick">Kataloqdan seç</button></div></div>`;
  }).join('');
  const n=state.useCart?state.cart.filter(c=>c.included).length:0;
  return `<div class="dc-sh"><div class="k">Addım 4 · Materiallar</div><h2>Üzlük materiallarını seçin</h2><div class="d">Səbətdəki məhsullar avtomatik daxil edilir, qalanları kataloqdan seçin.</div></div>
  <div class="dc-banner"><b>Səbətinizdəki ${n} məhsul hesablamaya avtomatik daxil edildi</b><div class="dc-tg grn ${state.useCart?'on':''}" data-t="useCart"><div class="dc-sw"></div></div></div>
  ${rows}`;
}
function stepSebet(){
  const rows=state.cart.map((c,i)=>`<div class="dc-cart-row ${c.included?'':'off'}" data-c="${i}"><div class="cbx">${CHK}</div><div class="dc-thumb"></div><div class="info"><b>${c.name}</b><div class="meta">${c.cat} · ${c.brand}</div><div class="calc">${c.calc}</div></div><div class="rr"><div class="p">${fmt(c.price)} ₼</div><span class="dc-stock ${c.inStock?'':'ord'}">${c.stock}</span></div></div>`).join('');
  const n=state.cart.filter(c=>c.included).length;
  return `<div class="dc-sh"><div class="k">Addım 5 · Səbət</div><h2>Səbətdəki məhsullar hesablamada</h2><div class="d">Miqdar sahə və ehtiyat faizinə görə avtomatik hesablanır. İstəmədiyinizi çıxarın.</div></div>
  ${rows}
  <div style="display:flex;justify-content:space-between;align-items:center;border:1px solid rgba(0,0,0,.1);border-radius:4px;padding:16px 20px"><b style="font-weight:600;font-size:14px">${n} məhsul seçildi · hesablamaya daxil</b><span style="font-weight:700;font-size:22px">${fmt(cartTotal())} <span style="font-size:14px;color:rgba(0,0,0,.5)">₼</span></span></div>`;
}
function stepYekun(){
  const e=computeEstimate(); const max=Math.max(...e.rows.map(r=>r[1]));
  const bd=e.rows.map(([l,v])=>`<div class="row"><div class="top"><span class="l">${l}</span><span class="v">${fmt(v)} ₼</span></div><div class="dc-bar ${v===max?'hi':''}"><i style="width:${Math.max(4,Math.round(v/max*100))}%"></i></div></div>`).join('');
  return `<div class="dc-sh"><div class="k">Addım 6 · Yekun smeta</div><h2>${totalArea()} m² üçün təmir smetası</h2><div class="d">Bütün materiallar, işlər və xidmətlər üzrə dəqiq hesablama.</div></div>
  <div class="dc-bd">${bd}</div>
  <div class="dc-total"><b>Yekun məbləğ</b><div class="v"><b>${fmt(e.total)}</b><span>AZN</span></div></div>`;
}

function renderSide(){
  if(state.step===5){
    sideEl.innerHTML=`
    <div class="dc-tips">
      <div class="dc-tip"><div class="d">✓</div><div><div class="t1">Premium kafeli standart ilə əvəz etməklə</div><div class="t2">8 400 ₼ qənaət</div></div></div>
      <div class="dc-tip"><div class="d">✓</div><div><div class="t1">Orta qiymətli qapılar seçməklə</div><div class="t2">büdcəni 12% azaldın</div></div></div>
      <div class="dc-tip"><div class="d">✓</div><div><div class="t1">Ən bahalı kateqoriya</div><div class="t2">üzlük materiallarıdır</div></div></div>
    </div>
    <div class="dc-act">
      <button class="dc-next" id="dcAddAll" style="padding:16px">Bütün materialları səbətə at</button>
      <div class="dc-sec"><button id="dcPdf">PDF</button><button id="dcWa">WhatsApp</button><button id="dcSave">Yadda saxla</button></div>
      <button class="dc-outline" id="dcTurnkey">Açar təslim təmir sifariş et</button>
    </div>`;
    document.getElementById('dcAddAll').addEventListener('click',()=>alert('Bütün materiallar səbətə əlavə olundu.'));
    document.getElementById('dcPdf').addEventListener('click',()=>window.print());
    document.getElementById('dcSave').addEventListener('click',()=>{ try{localStorage.setItem('archi-estimate',JSON.stringify(computeEstimate()));}catch(e){} alert('Smeta yadda saxlanıldı.'); });
    document.getElementById('dcWa').addEventListener('click',()=>{ const e=computeEstimate(); window.open('https://wa.me/?text='+encodeURIComponent('ARCHİ smeta: '+fmt(e.total)+' AZN'),'_blank'); });
    document.getElementById('dcTurnkey').addEventListener('click',()=>alert('Açar təslim sifariş göndərildi. Menecer sizinlə əlaqə saxlayacaq.'));
    return;
  }
  const e=computeEstimate();
  const cart=cartTotal(), works=worksCost();
  sideEl.innerHTML=`
  <div class="dc-sum">
    <div class="lbl">Cari smeta</div>
    <div class="big"><b>≈ ${fmt(e.total)}</b><span>AZN</span></div>
    <div style="font-size:13px;color:rgba(0,0,0,.5)">${totalArea()} m² · ${state.rooms.length} otaq</div>
    <div class="rows">
      <div class="r"><span>İşlər</span><b>${fmt(works)} ₼</b></div>
      <div class="r"><span>Səbətdəki materiallar</span><b>${fmt(cart)} ₼</b></div>
      <div class="r"><span>Ehtiyat (10%)</span><b>${fmt(e.rows[9][1])} ₼</b></div>
    </div>
  </div>
  ${state.step>=3?`<div class="dc-banner" style="flex-direction:column;align-items:stretch;gap:10px"><b>Səbətinizdə ${state.cart.length} məhsul var</b><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;color:rgba(0,0,0,.6)">Hesablamada istifadə</span><div class="dc-tg grn ${state.useCart?'on':''}" data-t="useCart"><div class="dc-sw"></div></div></div></div>`:''}
  <div class="dc-nav">
    ${state.step>0?'<button class="dc-back" id="dcBack">Geri</button>':''}
    <button class="dc-next" id="dcNextBtn">${state.step===4?'Smetanı hesabla':'Növbəti addım'}  →</button>
  </div>`;
  const b=document.getElementById('dcBack'); if(b) b.addEventListener('click',()=>{ state.step--; render(); });
  document.getElementById('dcNextBtn').addEventListener('click',()=>{ if(state.step<5){ state.step++; render(); } });
  bindToggles(sideEl);
}

function bindToggles(root){
  root.querySelectorAll('.dc-tg[data-t]').forEach(t=>t.addEventListener('click',()=>{ const k=t.dataset.t; state[k]=!state[k]; render(); }));
}

function render(){
  renderStepper();
  const fns=[stepObyekt,stepOtaqlar,stepIsler,stepMateriallar,stepSebet,stepYekun];
  mainEl.innerHTML=fns[state.step]();
  bindMain();
  renderSide();
  window.scrollTo({top:0,behavior:'smooth'});
}
function bindMain(){
  // chips (state key)
  mainEl.querySelectorAll('.dc-chips[data-key]').forEach(g=>g.addEventListener('click',e=>{const btn=e.target.closest('.dc-chip');if(!btn)return;state[g.dataset.key]=btn.dataset.v;render();}));
  // room chips
  mainEl.querySelectorAll('.dc-chips[data-rk]').forEach(g=>g.addEventListener('click',e=>{const btn=e.target.closest('.dc-chip');if(!btn)return;state.rooms[+g.dataset.ri][g.dataset.rk]=btn.dataset.v;render();}));
  // area/city/floor
  const a=document.getElementById('dcArea'); if(a)a.addEventListener('input',()=>{state.area=+a.value||0;renderSide();});
  const c=document.getElementById('dcCity'); if(c)c.addEventListener('input',()=>state.city=c.value);
  const f=document.getElementById('dcFloor'); if(f)f.addEventListener('input',()=>state.floor=f.value);
  // toggles in main
  bindToggles(mainEl);
  mainEl.querySelectorAll('.dc-tg[data-rheat]').forEach(t=>t.addEventListener('click',()=>{const i=+t.dataset.rheat;state.rooms[i].heat=!state.rooms[i].heat;render();}));
  // room inputs
  mainEl.querySelectorAll('input[data-r]').forEach(inp=>inp.addEventListener('input',()=>{const i=+inp.dataset.r,fld=inp.dataset.f;state.rooms[i][fld]=/area|h|per|doors|win/.test(fld)?(+inp.value||0):inp.value;renderSide();}));
  // room open/remove/add
  mainEl.querySelectorAll('[data-open]').forEach(el=>el.addEventListener('click',()=>{state.editRoom=+el.dataset.open;render();}));
  mainEl.querySelectorAll('[data-rm]').forEach(el=>el.addEventListener('click',ev=>{ev.stopPropagation();const i=+el.dataset.rm;if(state.rooms.length>1){state.rooms.splice(i,1);state.editRoom=0;render();}}));
  const add=document.getElementById('dcAddRoom'); if(add)add.addEventListener('click',()=>{state.rooms.push({name:"Yeni otaq",area:12,h:2.8,per:14,doors:1,win:1,floor:"Laminat",wall:"Boya",heat:false});state.editRoom=state.rooms.length-1;render();});
  // works
  mainEl.querySelectorAll('.dc-wr[data-w]').forEach(el=>el.addEventListener('click',()=>{const i=+el.dataset.w;state.works[i]=!state.works[i];render();}));
  // cart rows
  mainEl.querySelectorAll('.dc-cart-row[data-c]').forEach(el=>el.querySelector('.cbx').addEventListener('click',()=>{const i=+el.dataset.c;state.cart[i].included=!state.cart[i].included;render();}));
}

render();
</script>
<script src="archi.js"></script>
</body>
</html>
