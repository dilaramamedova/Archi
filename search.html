<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>«kafel» üçün nəticələr — ARCHİ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="archi.css">
<!-- Tailwind — sıra vacibdir: tema Tailwind compiler-indən ƏVVƏL DOM-a düşməlidir. -->
<script src="archi-tw.js"></script>
<script src="tailwind-browser.js"></script>
</head>
<body>

<div data-archi="nav"></div>

<!-- Axtarış nəticələri — Figma 1105:18662 ilə 1:1 -->
<section class="pt-8 pb-14">
  <div class="mx-auto flex max-w-[1384px] flex-col gap-6 px-7">

    <!-- başlıq -->
    <div class="flex flex-col gap-3">
      <div class="flex items-center gap-2.5"><span class="h-0.5 w-8 bg-yellow"></span><p class="text-[13px] font-medium tracking-[.5px] text-black uppercase">Axtarış nəticələri</p></div>
      <div class="flex items-end gap-3.5">
        <h1 class="text-[38px] leading-[1.2] font-semibold tracking-[-.4px] text-black max-[900px]:text-[28px]" id="srQuery">«kafel» üçün nəticələr</h1>
        <span class="pb-[7px] text-[15px] text-black">86 nəticə</span>
      </div>
    </div>

    <!-- tablar — aktiv vəziyyət `data-on` atributu + Tailwind data variantı ilə -->
    <div class="flex flex-wrap gap-2" id="srTabs">
      <button class="cursor-pointer rounded-ds border border-black/14 bg-white px-4 py-2.5 text-sm font-medium text-black transition-[border-color,background] duration-200 hover:border-black/35 data-[on=true]:border-black data-[on=true]:bg-ink data-[on=true]:font-semibold data-[on=true]:text-white" data-t="all" data-on="true">Hamısı (86)</button>
      <button class="cursor-pointer rounded-ds border border-black/14 bg-white px-4 py-2.5 text-sm font-medium text-black transition-[border-color,background] duration-200 hover:border-black/35 data-[on=true]:border-black data-[on=true]:bg-ink data-[on=true]:font-semibold data-[on=true]:text-white" data-t="prod">Məhsullar (64)</button>
      <button class="cursor-pointer rounded-ds border border-black/14 bg-white px-4 py-2.5 text-sm font-medium text-black transition-[border-color,background] duration-200 hover:border-black/35 data-[on=true]:border-black data-[on=true]:bg-ink data-[on=true]:font-semibold data-[on=true]:text-white" data-t="usta">Ustalar (14)</button>
      <button class="cursor-pointer rounded-ds border border-black/14 bg-white px-4 py-2.5 text-sm font-medium text-black transition-[border-color,background] duration-200 hover:border-black/35 data-[on=true]:border-black data-[on=true]:bg-ink data-[on=true]:font-semibold data-[on=true]:text-white" data-t="blog">Məqalələr (8)</button>
    </div>

    <!-- Məhsullar · `gap-3` layer-siz utility olduğu üçün `.grid4` komponentinin gap-2-sini üstələyir -->
    <div class="flex flex-col gap-6" data-sec="prod">
      <div class="flex items-end justify-between pt-2">
        <div class="flex items-end gap-2.5"><h2 class="text-[26px] font-semibold tracking-[-.2px] text-ink max-[900px]:text-[22px]">Məhsullar</h2><span class="pb-1 text-sm text-black">64 nəticə</span></div>
        <a class="relative pb-1 text-xs font-medium tracking-[.6px] text-[#141414] uppercase before:absolute before:inset-x-0 before:bottom-0 before:h-0.5 before:bg-yellow-line before:content-[''] after:absolute after:inset-x-0 after:bottom-0 after:h-0.5 after:origin-left after:scale-x-0 after:bg-ink/70 after:transition-transform after:duration-[350ms] after:content-[''] hover:after:scale-x-100">Hamısına bax →</a>
      </div>
      <div class="grid4 gap-3" id="srProd"></div>
    </div>

    <!-- Ustalar -->
    <div class="flex flex-col gap-6" data-sec="usta">
      <div class="flex items-end justify-between pt-2">
        <div class="flex items-end gap-2.5"><h2 class="text-[26px] font-semibold tracking-[-.2px] text-ink max-[900px]:text-[22px]">Ustalar</h2><span class="pb-1 text-sm text-black">14 nəticə</span></div>
        <a class="relative pb-1 text-xs font-medium tracking-[.6px] text-[#141414] uppercase before:absolute before:inset-x-0 before:bottom-0 before:h-0.5 before:bg-yellow-line before:content-[''] after:absolute after:inset-x-0 after:bottom-0 after:h-0.5 after:origin-left after:scale-x-0 after:bg-ink/70 after:transition-transform after:duration-[350ms] after:content-[''] hover:after:scale-x-100">Hamısına bax →</a>
      </div>
      <div class="grid4 gap-3" id="srUsta"></div>
    </div>

    <!-- Məqalələr -->
    <div class="flex flex-col gap-6" data-sec="blog">
      <div class="flex items-end justify-between pt-2">
        <div class="flex items-end gap-2.5"><h2 class="text-[26px] font-semibold tracking-[-.2px] text-ink max-[900px]:text-[22px]">Məqalələr</h2><span class="pb-1 text-sm text-black">8 nəticə</span></div>
        <a class="relative pb-1 text-xs font-medium tracking-[.6px] text-[#141414] uppercase before:absolute before:inset-x-0 before:bottom-0 before:h-0.5 before:bg-yellow-line before:content-[''] after:absolute after:inset-x-0 after:bottom-0 after:h-0.5 after:origin-left after:scale-x-0 after:bg-ink/70 after:transition-transform after:duration-[350ms] after:content-[''] hover:after:scale-x-100" href="blog.html">Hamısına bax →</a>
      </div>
      <div class="grid4 gap-3" id="srBlog"></div>
    </div>

  </div>
</section>

<div data-archi="footer"></div>

<script src="archi.js"></script>
<script>
  // URL-dən sorğunu götür (?q=...), yoxdursa Figma-dakı nümunə «kafel»
  const q = new URLSearchParams(location.search).get('q') || 'kafel';
  document.getElementById('srQuery').textContent = '«' + q + '» üçün nəticələr';
  document.title = '«' + q + '» üçün nəticələr — ARCHİ';

  // ---- Məhsullar (Figma: card-1, card-3, card-1, card-2) ----
  const prods = [
    {cat:"Kafel & metlax", name:"Keramik kafel 60x60, mat",  img:"assets/fig/1ed736a990f0.jpg"},
    {cat:"İzolyasiya",     name:"Mineral yun izolyasiya",     img:"assets/fig/6146d21348a6.jpg"},
    {cat:"Kafel & metlax", name:"Keramik kafel 60x60, mat",  img:"assets/fig/1ed736a990f0.jpg"},
    {cat:"Boya",           name:"Akrilik fasad boyası",       img:"assets/fig/50873ec31b52.jpg"}
  ];
  document.getElementById('srProd').innerHTML = prods.map(p=>`
    <a class="pcard" href="product.html">
      <div class="prod-cursor"><span>Məhsula keç</span></div>
      <div class="ph">
        <img class="prod" src="${p.img}" alt="">
        <div class="badges"><span class="b">Yeni məhsul</span><span class="b">Stokda var</span></div>
        <div class="heart"><img src="assets/ic-heart2.svg" alt=""></div>
        <div class="dots"><i class="on"></i><i></i><i></i></div>
      </div>
      <div class="rating"><img src="assets/ic-star.svg" alt=""><p>4.4 <span>(1,876 rəy)</span></p></div>
      <div class="cat">${p.cat}</div>
      <div class="name">${p.name}</div>
      <div class="price"><span class="now">23.90 ₼</span><span class="old">15,99 ₼</span><span class="off">-48%</span></div>
    </a>`).join('');

  // ---- Ustalar ----
  const ustalar = [
    {bg:"#f5fbff", role:"Kafel & metlax ustası", name:"Rəşad Məmmədov"},
    {bg:"#fdf5ff", role:"Kafel & metlax ustası", name:"Rəşad Məmmədov"},
    {bg:"#f5fffb", role:"İnteryer dizayner",     name:"Rəna Məmmədova"},
    {bg:"#fff5f5", role:"Kafel & metlax ustası", name:"Rəşad Məmmədov"}
  ];
  document.getElementById('srUsta').innerHTML = ustalar.map(s=>`
    <div class="scard">
      <div class="top" style="background:${s.bg}">
        <div class="badges">
          <span class="b"><img src="assets/ic-crown.svg" alt="">Top usta</span>
          <span class="b ok"><img src="assets/ic-check.svg" alt="">Təsdiqlənmiş</span>
        </div>
        <div class="heart"><img src="assets/ic-heart2.svg" alt=""></div>
        <div class="avatar"><img src="assets/ic-person.svg" alt=""></div>
        <div class="role">${s.role}</div>
        <div class="rating"><img src="assets/ic-star.svg" alt=""><p>4.9 <span>(416 rəy)</span></p></div>
      </div>
      <div>
        <div class="name">${s.name}</div>
        <div class="meta"><span>12 illik təcrübə</span><span>320 layihə</span></div>
      </div>
    </div>`).join('');

  // ---- Məqalələr ----
  const posts = [
    {time:"6 dəq oxu", title:"Təmirə hardan başlamaq lazımdır?", ex:"İlk addımlar, büdcə planı və ən çox edilən səhvlər — başlamazdan əvvəl bilməli olduqlar."},
    {time:"4 dəq oxu", title:"Düzgün laminant necə seçilir?", ex:"Sinif, qalınlıq, su davamlılığı — otağa görə hansını seçmək lazımdır."},
    {time:"5 dəq oxu", title:"Fasad boyası: tam bələdçi", ex:"Hava şəraitinə davamlılıq, örtmə hesabı və tətbiq qaydaları bir məqalədə."},
    {time:"6 dəq oxu", title:"Təmirə hardan başlamaq lazımdır?", ex:"İlk addımlar, büdcə planı və ən çox edilən səhvlər — başlamazdan əvvəl bilməli olduqlar."}
  ];
  document.getElementById('srBlog').innerHTML = posts.map(p=>`
    <a class="post" href="blog.html">
      <div class="ph"><img src="assets/fig/759c1d0b83ee.jpg" alt=""></div>
      <div class="body">
        <div class="time">${p.time}</div>
        <h3>${p.title}</h3>
        <p class="ex">${p.ex}</p>
        <span class="read">Oxu →</span>
      </div>
    </a>`).join('');

  // ---- Tab filtrləmə ----
  document.getElementById('srTabs').addEventListener('click', e=>{
    const b = e.target.closest('[data-t]'); if(!b) return;
    document.querySelectorAll('[data-t]').forEach(t=>{ t.dataset.on = 'false'; });
    b.dataset.on = 'true';
    const t = b.dataset.t;
    document.querySelectorAll('[data-sec]').forEach(s=>{
      s.style.display = (t==='all' || s.dataset.sec===t) ? '' : 'none';
    });
  });

  // ---- URL-dən tab seçimi (?tab=prod|usta|blog) — məs. ana səhifədən «Ətraflı bax» ----
  const tabParam = new URLSearchParams(location.search).get('tab');
  if(tabParam){
    const tb = document.querySelector('[data-t="'+tabParam+'"]');
    if(tb) tb.click();
  }
</script>

</body>
</html>
