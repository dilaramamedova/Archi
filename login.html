<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daxil ol — ARCHİ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- archi.css hələ lazımdır: inject olunan navbar/footer onun class-larından istifadə edir. -->
<link rel="stylesheet" href="archi.css">
<!-- Tailwind — sıra vacibdir: tema Tailwind compiler-indən ƏVVƏL DOM-a düşməlidir. -->
<script src="archi-tw.js"></script>
<script src="tailwind-browser.js"></script>
</head>
<body>

<div data-archi="nav"></div>

<section class="min-h-[60vh] bg-gray-soft2 py-16">
  <div class="mx-auto max-w-[460px] px-7">
    <div class="flex flex-col gap-6 border border-black/12 bg-white p-10 shadow-[-4px_4px_4px_rgba(0,0,0,0.05)] max-[640px]:p-6">
      <div class="flex flex-col gap-2">
        <div class="flex items-center gap-3">
          <span class="h-1 w-8 rounded-[2px] bg-yellow"></span>
          <p class="text-[13px] font-medium tracking-[1.4px] text-black/55 uppercase">Xoş gəlmisən</p>
        </div>
        <h1 class="text-[32px] font-semibold tracking-[-0.4px] text-black/90 max-[640px]:text-[26px]">Daxil ol</h1>
        <p class="text-base leading-[1.5] text-black/55">Hesabına gir — alıcı, satıcı və ya usta kabinetinə davam et.</p>
      </div>

      <div class="hidden border border-green bg-[#eafce9] px-4 py-3.5 text-[15px] text-[#0a7a14]" id="okMsg">Giriş uğurlu oldu! (demo — backend qoşulmayıb)</div>

      <form class="flex flex-col gap-[18px]" id="loginForm" onsubmit="return false">
        <div class="flex flex-col gap-2">
          <label class="text-sm font-medium text-black/70">E-poçt və ya telefon</label>
          <input class="border border-black/20 px-4 py-3.5 text-base text-black outline-none transition-[border-color] duration-200 placeholder:text-black/40 focus:border-black" type="text" placeholder="email@example.com" required>
        </div>
        <div class="flex flex-col gap-2">
          <label class="text-sm font-medium text-black/70">Şifrə</label>
          <input class="border border-black/20 px-4 py-3.5 text-base text-black outline-none transition-[border-color] duration-200 placeholder:text-black/40 focus:border-black" type="password" placeholder="Şifrə" required>
        </div>
        <div class="flex items-center justify-between text-sm">
          <label class="flex items-center gap-2 text-black/70"><input class="size-[18px] accent-yellow" type="checkbox"> Məni xatırla</label>
          <a class="border-b border-yellow-line text-black/70" href="#">Şifrəni unutmusan?</a>
        </div>
        <button class="h-[54px] cursor-pointer border-none bg-yellow text-lg font-semibold text-ink transition-[filter] duration-200 hover:brightness-[.93]" type="submit">Daxil ol</button>
        <p class="text-center text-[15px] text-black/60">Hesabın yoxdur? <a class="border-b-2 border-yellow-line font-semibold text-ink" href="register.html">Qeydiyyatdan keç</a></p>
      </form>
    </div>
  </div>
</section>

<div data-archi="footer"></div>

<script>
  document.getElementById('loginForm').addEventListener('submit',()=>{
    document.getElementById('okMsg').classList.remove('hidden');
  });
</script>
<script src="archi.js"></script>
</body>
</html>
