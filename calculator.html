<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sürətli təmir kalkulyatoru — ARCHİ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="archi.css">
<style>
  /* ===== Sürətli kalkulyator ===== */
  .qc-page{background:var(--gray-soft2);padding:48px 0 80px;min-height:60vh}
  .qc-page>.inner{max-width:1384px;margin:0 auto}
  .qc-crumbs{display:flex;align-items:center;gap:6px;font-size:14px;color:rgba(0,0,0,.5);margin-bottom:28px}
  .qc-crumbs a{color:rgba(0,0,0,.5)} .qc-crumbs .c2{color:rgba(0,0,0,.9)}
  .qc-card{background:#fff;border:1px solid rgba(0,0,0,.1);border-radius:4px;max-width:620px;margin:0 auto;padding:28px;display:flex;flex-direction:column;gap:20px}
  .qc-tag{display:flex;align-items:center;gap:10px}
  .qc-tag .line{width:28px;height:4px;border-radius:4px;background:var(--yellow-line)}
  .qc-tag p{font-weight:600;font-size:12px;letter-spacing:1px;color:rgba(0,0,0,.5);text-transform:uppercase}
  .qc-card h1{font-weight:700;font-size:24px;color:#111;letter-spacing:-.3px}
  .qc-card .qc-sub{font-size:14px;color:rgba(0,0,0,.5);margin-top:2px}
  .qc-group{display:flex;flex-direction:column;gap:10px}
  .qc-group>label{font-weight:600;font-size:13px;color:#111}
  .qc-chips{display:flex;flex-wrap:wrap;gap:8px}
  .qc-chip{padding:9px 14px;border-radius:4px;border:1px solid rgba(0,0,0,.1);background:#fff;font-weight:500;font-size:13px;color:rgba(0,0,0,.7);cursor:pointer;transition:all .15s;white-space:nowrap}
  .qc-chip:hover{border-color:rgba(0,0,0,.35)}
  .qc-chip.on{background:#111;border-color:#111;color:#fff;font-weight:600}
  .qc-field{display:flex;align-items:center;gap:6px;border:1px solid rgba(0,0,0,.14);border-radius:4px;padding:12px 16px;transition:border-color .2s}
  .qc-field:focus-within{border-color:#111}
  .qc-field input{border:none;outline:none;width:100%;font-size:20px;font-weight:700;color:#111;background:none;font-family:inherit}
  .qc-field .u{font-size:14px;color:rgba(0,0,0,.5)}
  .qc-div{height:1px;background:rgba(0,0,0,.1);margin:2px 0}
  .qc-rlbl{font-weight:600;font-size:13px;color:rgba(0,0,0,.5)}
  .qc-tiers{display:flex;gap:12px}
  .qc-tier{flex:1;min-width:0;border-radius:4px;border:1px solid rgba(0,0,0,.1);background:#f9f9fb;padding:16px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:all .15s}
  .qc-tier:hover{border-color:rgba(0,0,0,.3)}
  .qc-tier.on{background:#fffdd9;border:2px solid var(--yellow-line);padding:15px}
  .qc-tier .tn{font-weight:600;font-size:13px;color:#111}
  .qc-tier .tp{display:flex;align-items:baseline;gap:3px}
  .qc-tier .tp b{font-weight:700;font-size:19px;color:#111}
  .qc-tier .tp span{font-size:11px;font-weight:500;color:rgba(0,0,0,.5)}
  .qc-tier .rec{font-size:11px;font-weight:500;color:#8c7f0d}
  .qc-cta{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;background:var(--yellow);border-radius:4px;font-weight:600;font-size:15px;color:#111;text-decoration:none;transition:filter .2s;border:none;cursor:pointer}
  .qc-cta:hover{filter:brightness(.93)}
  .qc-links{display:flex;justify-content:center;gap:20px;flex-wrap:wrap}
  .qc-links button{background:none;border:none;font-weight:500;font-size:13px;color:rgba(0,0,0,.4);cursor:pointer;font-family:inherit}
  .qc-links button:hover{color:#111}
  @media(max-width:640px){ .qc-card{padding:20px} .qc-tiers{flex-direction:column} }
</style>
</head>
<body>

<div data-archi="nav"></div>

<section class="qc-page">
  <div class="inner">
    <nav class="qc-crumbs">
      <a href="index.html">Ana səhifə</a><span>/</span><span class="c2">Sürətli kalkulyator</span>
    </nav>

    <div class="qc-card">
      <div>
        <div class="qc-tag"><span class="line"></span><p>Sürətli kalkulyator</p></div>
        <h1 style="margin-top:8px">Təmirin təxmini dəyəri</h1>
        <div class="qc-sub">Bir neçə parametr — 3 büdcə variantı.</div>
      </div>

      <div class="qc-group">
        <label>Obyektin növü</label>
        <div class="qc-chips" data-key="obj">
          <button class="qc-chip on" data-v="menzil" data-m="1">Mənzil</button>
          <button class="qc-chip" data-v="ev" data-m="1.1">Fərdi ev</button>
          <button class="qc-chip" data-v="ofis" data-m="0.95">Ofis</button>
          <button class="qc-chip" data-v="kom" data-m="1.05">Kommersiya</button>
        </div>
      </div>

      <div class="qc-group">
        <label>Obyektin sahəsi</label>
        <div class="qc-field"><input id="qcArea" type="number" min="1" value="80"><span class="u">m²</span></div>
      </div>

      <div class="qc-group">
        <label>Təmir növü</label>
        <div class="qc-chips" data-key="type">
          <button class="qc-chip" data-v="qara" data-m="0.55">Qara</button>
          <button class="qc-chip" data-v="kosmetik" data-m="0.7">Kosmetik</button>
          <button class="qc-chip on" data-v="esasli" data-m="1">Əsaslı</button>
          <button class="qc-chip" data-v="acar" data-m="1.25">Açar təslim</button>
        </div>
      </div>

      <div class="qc-group">
        <label>Otaqların sayı</label>
        <div class="qc-chips" data-key="rooms">
          <button class="qc-chip" data-v="studio" data-m="0.95">Studio</button>
          <button class="qc-chip" data-v="1" data-m="1">1</button>
          <button class="qc-chip on" data-v="2" data-m="1.03">2</button>
          <button class="qc-chip" data-v="3" data-m="1.06">3</button>
          <button class="qc-chip" data-v="4" data-m="1.1">4+</button>
        </div>
      </div>

      <div class="qc-group">
        <label>Material səviyyəsi</label>
        <div class="qc-chips" data-key="level">
          <button class="qc-chip" data-v="ekonom">Ekonom</button>
          <button class="qc-chip on" data-v="standart">Standart</button>
          <button class="qc-chip" data-v="premium">Premium</button>
        </div>
      </div>

      <div class="qc-div"></div>

      <div class="qc-rlbl" id="qcRlbl">80 m² üçün təxmini dəyər</div>
      <div class="qc-tiers" id="qcTiers"></div>

      <a class="qc-cta" id="qcNext" href="calculator-detailed.html">Ətraflı hesablamanı əldə et  →</a>
      <div class="qc-links">
        <button id="qcPdf">PDF yüklə</button>
        <button id="qcWa">WhatsApp-a göndər</button>
        <button id="qcSave">Yadda saxla</button>
      </div>
    </div>
  </div>
</section>

<div data-archi="footer"></div>

<script>
  const TIERS=[
    {key:"ekonom",  name:"Ekonom",   rate:600},
    {key:"standart",name:"Standart", rate:900},
    {key:"premium", name:"Premium",  rate:1500}
  ];
  const state={obj:1,type:1,rooms:1.03,level:"standart",area:80};

  // chip qrupları
  document.querySelectorAll('.qc-chips').forEach(grp=>{
    grp.addEventListener('click',e=>{
      const btn=e.target.closest('.qc-chip'); if(!btn) return;
      grp.querySelectorAll('.qc-chip').forEach(b=>b.classList.remove('on'));
      btn.classList.add('on');
      const key=grp.dataset.key;
      if(key==='level') state.level=btn.dataset.v;
      else state[key]=parseFloat(btn.dataset.m)||1;
      recalc();
    });
  });
  const areaEl=document.getElementById('qcArea');
  areaEl.addEventListener('input',()=>{ state.area=parseFloat(areaEl.value)||0; recalc(); });

  const fmt=n=>Math.round(n).toLocaleString('ru-RU');
  function priceFor(rate){
    const adj=state.obj*state.type*state.rooms;
    return Math.round(state.area*rate*adj/1000)*1000;
  }
  function recalc(){
    document.getElementById('qcRlbl').textContent=(state.area||0)+' m² üçün təxmini dəyər';
    document.getElementById('qcTiers').innerHTML=TIERS.map(t=>{
      const on=t.key===state.level;
      return `<div class="qc-tier ${on?'on':''}" data-v="${t.key}">
        <div class="tn">${t.name}</div>
        <div class="tp"><b>${fmt(priceFor(t.rate))}</b><span>AZN-dən</span></div>
        ${on?'<div class="rec">Tövsiyə</div>':''}
      </div>`;
    }).join('');
    document.querySelectorAll('#qcTiers .qc-tier').forEach(el=>{
      el.addEventListener('click',()=>{
        state.level=el.dataset.v;
        document.querySelectorAll('.qc-chips[data-key="level"] .qc-chip').forEach(b=>b.classList.toggle('on',b.dataset.v===state.level));
        recalc();
      });
    });
    // seçimləri ətraflı kalkulyatora ötürmək üçün saxla
    try{ localStorage.setItem('archi-quickcalc', JSON.stringify({area:state.area,level:state.level})); }catch(e){}
  }
  recalc();

  // linklər (demo davranış)
  document.getElementById('qcSave').addEventListener('click',()=>{
    try{ localStorage.setItem('archi-quickcalc-saved', JSON.stringify({...state,ts:Date.now()})); }catch(e){}
    alert('Hesablama yadda saxlanıldı.');
  });
  document.getElementById('qcWa').addEventListener('click',()=>{
    const p=fmt(priceFor(TIERS.find(t=>t.key===state.level).rate));
    const msg=encodeURIComponent(`ARCHİ təmir hesablaması: ${state.area} m² · ${state.level} · ~${p} AZN`);
    window.open('https://wa.me/?text='+msg,'_blank');
  });
  document.getElementById('qcPdf').addEventListener('click',()=>window.print());
</script>
<script src="archi.js"></script>
</body>
</html>
