<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sürətli təmir kalkulyatoru — ARCHİ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="archi.css">
<!-- Tailwind — sıra vacibdir: tema Tailwind compiler-indən ƏVVƏL DOM-a düşməlidir. -->
<script src="archi-tw.js"></script>
<!-- Səhifəyə xas komponent: `.qc-chip` bu səhifədə 19 dəfə təkrarlanır, ona görə
     utility sətrini 19 dəfə yazmaq yerinə burada bir dəfə təyin olunur.
     Bu blok CDN skriptindən ƏVVƏL gəlməlidir — compiler bütün
     `style[type="text/tailwindcss"]` elementlərini başlayarkən oxuyur. -->
<style type="text/tailwindcss">
  @layer components {
    .qc-chip {
      @apply cursor-pointer rounded-ds border border-black/10 bg-white px-3.5 py-[9px] text-[13px] font-medium whitespace-nowrap text-black/70 transition-all duration-150;
      @apply hover:border-black/35;
      @apply data-[on=true]:border-ink data-[on=true]:bg-ink data-[on=true]:font-semibold data-[on=true]:text-white;
    }
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

<div data-archi="nav"></div>

<section class="min-h-[60vh] bg-gray-soft2 pt-12 pb-20">
  <div class="mx-auto max-w-[1384px]">
    <nav class="mb-7 flex items-center gap-1.5 text-sm text-black/50">
      <a href="index.html">Ana səhifə</a><span>/</span><span class="text-black/90">Sürətli kalkulyator</span>
    </nav>

    <div class="mx-auto flex max-w-[620px] flex-col gap-5 rounded-ds border border-black/10 bg-white p-7 max-[640px]:p-5">
      <div>
        <div class="flex items-center gap-2.5"><span class="h-1 w-7 rounded-ds bg-yellow-line"></span><p class="text-xs font-semibold tracking-[1px] text-black/50 uppercase">Sürətli kalkulyator</p></div>
        <h1 class="mt-2 text-2xl font-bold tracking-[-.3px] text-ink">Təmirin təxmini dəyəri</h1>
        <div class="mt-0.5 text-sm text-black/50">Bir neçə parametr — 3 büdcə variantı.</div>
      </div>

      <!-- chip qrupları — seçili vəziyyət `data-on` atributu ilə -->
      <div class="flex flex-col gap-2.5">
        <label class="text-[13px] font-semibold text-ink">Obyektin növü</label>
        <div class="flex flex-wrap gap-2" data-key="obj">
          <button class="qc-chip" data-v="menzil" data-m="1" data-on="true">Mənzil</button>
          <button class="qc-chip" data-v="ev" data-m="1.1">Fərdi ev</button>
          <button class="qc-chip" data-v="ofis" data-m="0.95">Ofis</button>
          <button class="qc-chip" data-v="kom" data-m="1.05">Kommersiya</button>
        </div>
      </div>

      <div class="flex flex-col gap-2.5">
        <label class="text-[13px] font-semibold text-ink">Obyektin sahəsi</label>
        <div class="flex items-center gap-1.5 rounded-ds border border-black/14 px-4 py-3 transition-[border-color] duration-200 focus-within:border-ink">
          <input class="w-full border-none text-xl font-bold text-ink outline-none [background:none] [font-family:inherit]" id="qcArea" type="number" min="1" value="80">
          <span class="text-sm text-black/50">m²</span>
        </div>
      </div>

      <div class="flex flex-col gap-2.5">
        <label class="text-[13px] font-semibold text-ink">Təmir növü</label>
        <div class="flex flex-wrap gap-2" data-key="type">
          <button class="qc-chip" data-v="qara" data-m="0.55">Qara</button>
          <button class="qc-chip" data-v="kosmetik" data-m="0.7">Kosmetik</button>
          <button class="qc-chip" data-v="esasli" data-m="1" data-on="true">Əsaslı</button>
          <button class="qc-chip" data-v="acar" data-m="1.25">Açar təslim</button>
        </div>
      </div>

      <div class="flex flex-col gap-2.5">
        <label class="text-[13px] font-semibold text-ink">Otaqların sayı</label>
        <div class="flex flex-wrap gap-2" data-key="rooms">
          <button class="qc-chip" data-v="studio" data-m="0.95">Studio</button>
          <button class="qc-chip" data-v="1" data-m="1">1</button>
          <button class="qc-chip" data-v="2" data-m="1.03" data-on="true">2</button>
          <button class="qc-chip" data-v="3" data-m="1.06">3</button>
          <button class="qc-chip" data-v="4" data-m="1.1">4+</button>
        </div>
      </div>

      <div class="flex flex-col gap-2.5">
        <label class="text-[13px] font-semibold text-ink">Material səviyyəsi</label>
        <div class="flex flex-wrap gap-2" data-key="level">
          <button class="qc-chip" data-v="ekonom">Ekonom</button>
          <button class="qc-chip" data-v="standart" data-on="true">Standart</button>
          <button class="qc-chip" data-v="premium">Premium</button>
        </div>
      </div>

      <div class="my-0.5 h-px bg-black/10"></div>

      <div class="text-[13px] font-semibold text-black/50" id="qcRlbl">80 m² üçün təxmini dəyər</div>
      <div class="flex gap-3 max-[640px]:flex-col" id="qcTiers"></div>

      <a class="flex h-[50px] cursor-pointer items-center justify-center gap-2 rounded-ds border-none bg-yellow text-[15px] font-semibold text-ink no-underline transition-[filter] duration-200 hover:brightness-[.93]" id="qcNext" href="calculator-detailed.html">Ətraflı hesablamanı əldə et  →</a>
      <div class="flex flex-wrap justify-center gap-5">
        <button class="cursor-pointer border-none text-[13px] font-medium text-black/40 [background:none] [font-family:inherit] hover:text-ink" id="qcPdf">PDF yüklə</button>
        <button class="cursor-pointer border-none text-[13px] font-medium text-black/40 [background:none] [font-family:inherit] hover:text-ink" id="qcWa">WhatsApp-a göndər</button>
        <button class="cursor-pointer border-none text-[13px] font-medium text-black/40 [background:none] [font-family:inherit] hover:text-ink" id="qcSave">Yadda saxla</button>
      </div>
    </div>
  </div>
</section>

<div data-archi="footer"></div>

<script>
  const TIERS=[
    {key:"ekonom",  name:"Ekonom",   rate:600},
    {key:"standart",name:"Standart", rate:900},
    {key:"premium", name:"Premium",  rate:1500}
  ];
  // Tier kartının Tailwind class dəsti (JS-də qurulduğu üçün burada saxlanılır)
  const TIER_CLS='flex min-w-0 flex-1 cursor-pointer flex-col gap-1 rounded-ds border border-black/10 bg-[#f9f9fb] p-4 transition-all duration-150 hover:border-black/30 data-[on=true]:border-2 data-[on=true]:border-yellow-line data-[on=true]:bg-sel-bg data-[on=true]:p-[15px]';
  const state={obj:1,type:1,rooms:1.03,level:"standart",area:80};

  // chip qrupları
  document.querySelectorAll('[data-key]').forEach(grp=>{
    grp.addEventListener('click',e=>{
      const btn=e.target.closest('[data-v]'); if(!btn) return;
      grp.querySelectorAll('[data-v]').forEach(b=>{ b.dataset.on='false'; });
      btn.dataset.on='true';
      const key=grp.dataset.key;
      if(key==='level') state.level=btn.dataset.v;
      else state[key]=parseFloat(btn.dataset.m)||1;
      recalc();
    });
  });
  const areaEl=document.getElementById('qcArea');
  areaEl.addEventListener('input',()=>{ state.area=parseFloat(areaEl.value)||0; recalc(); });

  const fmt=n=>Math.round(n).toLocaleString('ru-RU');
  function priceFor(rate){
    const adj=state.obj*state.type*state.rooms;
    return Math.round(state.area*rate*adj/1000)*1000;
  }
  function recalc(){
    document.getElementById('qcRlbl').textContent=(state.area||0)+' m² üçün təxmini dəyər';
    document.getElementById('qcTiers').innerHTML=TIERS.map(t=>{
      const on=t.key===state.level;
      return `<div class="${TIER_CLS}" data-v="${t.key}" data-on="${on}">
        <div class="text-[13px] font-semibold text-ink">${t.name}</div>
        <div class="flex items-baseline gap-[3px]"><b class="text-[19px] font-bold text-ink">${fmt(priceFor(t.rate))}</b><span class="text-[11px] font-medium text-black/50">AZN-dən</span></div>
        ${on?'<div class="text-[11px] font-medium text-[#8c7f0d]">Tövsiyə</div>':''}
      </div>`;
    }).join('');
    document.querySelectorAll('#qcTiers [data-v]').forEach(el=>{
      el.addEventListener('click',()=>{
        state.level=el.dataset.v;
        document.querySelectorAll('[data-key="level"] [data-v]').forEach(b=>{ b.dataset.on=String(b.dataset.v===state.level); });
        recalc();
      });
    });
    // seçimləri ətraflı kalkulyatora ötürmək üçün saxla
    try{ localStorage.setItem('archi-quickcalc', JSON.stringify({area:state.area,level:state.level})); }catch(e){}
  }
  recalc();

  // linklər (demo davranış)
  document.getElementById('qcSave').addEventListener('click',()=>{
    try{ localStorage.setItem('archi-quickcalc-saved', JSON.stringify({...state,ts:Date.now()})); }catch(e){}
    alert('Hesablama yadda saxlanıldı.');
  });
  document.getElementById('qcWa').addEventListener('click',()=>{
    const p=fmt(priceFor(TIERS.find(t=>t.key===state.level).rate));
    const msg=encodeURIComponent(`ARCHİ təmir hesablaması: ${state.area} m² · ${state.level} · ~${p} AZN`);
    window.open('https://wa.me/?text='+msg,'_blank');
  });
  document.getElementById('qcPdf').addEventListener('click',()=>window.print());
</script>
<script src="archi.js"></script>
</body>
</html>
