<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Səbət — ARCHİ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- archi.css hələ lazımdır: inject olunan navbar/footer onun class-larından istifadə edir. -->
<link rel="stylesheet" href="archi.css">
<!-- Tailwind — sıra vacibdir: tema Tailwind compiler-indən ƏVVƏL DOM-a düşməlidir. -->
<script src="archi-tw.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>

<div data-archi="nav"></div>

<section class="min-h-[60vh] bg-gray-soft2 pt-10 pb-20">
  <div class="mx-auto flex max-w-[1240px] flex-col gap-6 px-5">
    <nav class="flex gap-1.5 text-sm text-black/50"><a href="index.html">Ana səhifə</a><span>/</span><span class="text-black/90">Səbət</span></nav>
    <h1 class="text-[30px] font-bold tracking-[-0.4px] text-ink">Səbətim</h1>
    <div class="grid grid-cols-[1fr_380px] items-start gap-6 max-[900px]:grid-cols-1">
      <div id="ctItems"></div>
      <aside class="sticky top-5 flex flex-col gap-4 rounded-ds border border-black/10 bg-white p-6 shadow-[0_4px_16px_rgba(0,0,0,0.05)] max-[900px]:static" id="ctSum"></aside>
    </div>
  </div>
</section>

<div data-archi="footer"></div>

<script>
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
// promokodlar
const PROMOS={
  "ARCHI15":{type:"pct",val:0.15,label:"15% endirim"},
  "YENI10": {type:"pct",val:0.10,label:"10% endirim"},
  "QIS20":  {type:"pct",val:0.20,min:200,label:"20% endirim (min 200 ₼)"}
};
const DELIVERY_FREE=100, DELIVERY_FEE=10;

// Tailwind class dəstləri — JS template-lərində təkrarlanmasın deyə bir yerdə
const CLS={
  row:    'flex items-center gap-4 rounded-ds border border-black/10 bg-white p-4 max-[560px]:flex-wrap',
  thumb:  'size-[70px] shrink-0 rounded-ds bg-[#eceef1] object-cover',
  info:   'min-w-0 flex-1',
  name:   'block text-[15px] font-semibold text-ink',
  meta:   'mt-0.5 text-[13px] text-black/50',
  unit:   'mt-1 text-[13px] text-black/50',
  qty:    'flex items-center overflow-hidden rounded-ds border border-black/15',
  qtyBtn: 'size-[34px] cursor-pointer border-none bg-white text-lg text-ink [font-family:inherit] hover:bg-gray-soft',
  qtyNum: 'min-w-[34px] text-center text-sm font-semibold',
  line:   'min-w-[92px] text-right text-base font-bold text-ink max-[560px]:min-w-[auto]',
  rm:     'cursor-pointer border-none p-1 text-[22px] leading-none text-black/35 [font-family:inherit] hover:text-[#c0392b]',
  empty:  'rounded-ds border border-black/10 bg-white px-6 py-[60px] text-center',
  emptyP: 'mb-5 text-base text-black/55',
  emptyA: 'inline-block rounded-ds bg-yellow px-7 py-[13px] font-semibold text-ink no-underline',
  items:  'flex flex-col gap-3'
};

let cart=[]; try{ cart=JSON.parse(localStorage.getItem('archi-cart')||'[]'); }catch(e){}
cart=cart.map(c=>({qty:1,...c, qty:c.qty||1}));
let promo=null; try{ promo=(localStorage.getItem('archi-promo')||'')||null; }catch(e){}

function save(){ try{ localStorage.setItem('archi-cart',JSON.stringify(cart)); }catch(e){}
  const b=document.getElementById('navCartCount'); if(b){ if(cart.length){b.textContent=cart.length;b.style.display='flex';}else b.style.display='none'; } }
function subtotal(){ return cart.reduce((s,c)=>s+(+c.price||0)*(c.qty||1),0); }
function discount(){ if(!promo||!PROMOS[promo]) return 0; const p=PROMOS[promo]; const sub=subtotal(); if(p.min&&sub<p.min) return 0; return p.type==="pct"? sub*p.val : p.val; }

const itemsEl=document.getElementById('ctItems'), sumEl=document.getElementById('ctSum');

function renderItems(){
  if(!cart.length){
    itemsEl.className='';
    itemsEl.innerHTML=`<div class="${CLS.empty}"><p class="${CLS.emptyP}">Səbətiniz boşdur.</p><a class="${CLS.emptyA}" href="index.html">Kampaniyalara bax</a></div>`;
    return;
  }
  itemsEl.className=CLS.items;
  itemsEl.innerHTML=cart.map((c,i)=>`
    <div class="${CLS.row}" data-i="${i}">
      <div class="${CLS.thumb}"></div>
      <div class="${CLS.info}"><b class="${CLS.name}">${c.name}</b><div class="${CLS.meta}">${(c.cat||'')}${c.brand?' · '+c.brand:''}</div><div class="${CLS.unit}">Vahid qiymət: ${fmt(c.price)} ₼</div></div>
      <div class="${CLS.qty}"><button class="${CLS.qtyBtn}" data-a="dec">−</button><span class="${CLS.qtyNum}">${c.qty}</span><button class="${CLS.qtyBtn}" data-a="inc">+</button></div>
      <div class="${CLS.line}">${fmt((+c.price||0)*(c.qty||1))} ₼</div>
      <button class="${CLS.rm}" data-a="rm" title="Sil">×</button>
    </div>`).join('');
  itemsEl.querySelectorAll('[data-i]').forEach(row=>{
    const i=+row.dataset.i;
    row.querySelectorAll('[data-a]').forEach(btn=>btn.addEventListener('click',()=>{
      const a=btn.dataset.a;
      if(a==='inc') cart[i].qty++;
      else if(a==='dec') cart[i].qty=Math.max(1,cart[i].qty-1);
      else if(a==='rm') cart.splice(i,1);
      save(); render();
    }));
  });
}
function renderSum(){
  const sub=subtotal(), disc=discount();
  const afterDisc=sub-disc;
  const delivery = cart.length? (afterDisc>=DELIVERY_FREE?0:DELIVERY_FEE) : 0;
  const total=afterDisc+delivery;
  const msgBase='text-[13px] font-medium';
  let msg='';
  if(promo){
    if(PROMOS[promo]){ const p=PROMOS[promo]; msg = (p.min&&sub<p.min)? `<div class="${msgBase} text-[#c0392b]">Kod ${promo}: minimum ${p.min} ₼ sifariş tələb olunur</div>` : `<div class="${msgBase} text-[#237a37]">✓ ${promo} tətbiq olundu — ${p.label}</div>`; }
    else msg=`<div class="${msgBase} text-[#c0392b]">Belə promokod yoxdur</div>`;
  }
  sumEl.innerHTML=`
    <h3 class="text-lg font-bold text-ink">Sifariş xülasəsi</h3>
    <div class="flex flex-col gap-2">
      <label class="text-[13px] font-semibold text-ink">Promokod</label>
      <div class="flex gap-2">
        <input class="flex-1 rounded-ds border border-black/15 px-3.5 py-[11px] text-sm uppercase outline-none [font-family:inherit] focus:border-ink" id="ctPromo" placeholder="ARCHI15" value="${promo||''}">
        <button class="cursor-pointer rounded-ds border-none bg-ink px-[18px] text-sm font-semibold text-white [font-family:inherit]" id="ctApply">Tətbiq et</button>
      </div>
      ${msg}
      <div class="text-xs text-black/45">Sınayın: <code class="rounded-[3px] bg-gray-soft px-1.5 py-px font-bold text-ink">ARCHI15</code> · <code class="rounded-[3px] bg-gray-soft px-1.5 py-px font-bold text-ink">YENI10</code> · <code class="rounded-[3px] bg-gray-soft px-1.5 py-px font-bold text-ink">QIS20</code></div>
    </div>
    <div class="flex flex-col gap-2.5 border-t border-black/8 pt-3.5">
      <div class="flex justify-between text-sm text-black/65"><span>Ara cəm (${cart.reduce((s,c)=>s+c.qty,0)} məhsul)</span><b class="font-semibold text-ink">${fmt(sub)} ₼</b></div>
      ${disc>0?`<div class="flex justify-between text-sm text-black/65"><span>Endirim (${promo})</span><b class="font-semibold text-[#237a37]">− ${fmt(disc)} ₼</b></div>`:''}
      <div class="flex justify-between text-sm text-black/65"><span>Çatdırılma</span><b class="font-semibold text-ink">${delivery?fmt(delivery)+' ₼':'Pulsuz'}</b></div>
    </div>
    <div class="flex items-baseline justify-between border-t border-black/10 pt-3.5"><span class="text-base font-bold">Yekun</span><span class="text-[26px] font-bold text-ink">${fmt(total)} ₼</span></div>
    <button class="h-[52px] cursor-pointer rounded-ds border-none bg-yellow text-base font-semibold text-ink transition-[filter] duration-200 [font-family:inherit] hover:brightness-[.93]" id="ctCheckout">Sifarişi rəsmiləşdir</button>`;
  const applyBtn=document.getElementById('ctApply'), inp=document.getElementById('ctPromo');
  if(applyBtn){
    const apply=()=>{ const code=(inp.value||'').trim().toUpperCase(); promo=code||null; try{localStorage.setItem('archi-promo',promo||'');}catch(e){} renderSum(); };
    applyBtn.addEventListener('click',apply);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') apply(); });
  }
  const co=document.getElementById('ctCheckout'); if(co) co.addEventListener('click',()=>{ if(!cart.length){alert('Səbət boşdur.');return;} alert('Sifariş qəbul olundu! Yekun: '+fmt(total)+' ₼'); });
}
function render(){ renderItems(); renderSum(); }
save(); render();
</script>
<script src="archi.js"></script>
</body>
</html>
