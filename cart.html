<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Səbət — ARCHİ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="archi.css">
<style>
  .ct-page{background:var(--gray-soft2);padding:40px 0 80px;min-height:60vh}
  .ct-page>.inner{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:24px}
  .ct-crumbs{display:flex;gap:6px;font-size:14px;color:var(--text-muted)}
  .ct-crumbs a{color:var(--text-muted)} .ct-crumbs .c2{color:var(--text-primary)}
  .ct-title{font-weight:700;font-size:30px;color:#111;letter-spacing:-.4px}
  .ct-body{display:grid;grid-template-columns:1fr 380px;gap:24px;align-items:start}
  .ct-items{display:flex;flex-direction:column;gap:12px}
  .ct-row{display:flex;align-items:center;gap:16px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:16px}
  .ct-thumb{width:70px;height:70px;border-radius:var(--radius);background:#eceef1;flex-shrink:0;object-fit:cover}
  .ct-info{flex:1;min-width:0}
  .ct-info b{font-weight:600;font-size:15px;color:#111;display:block}
  .ct-info .m{font-size:13px;color:var(--text-muted);margin-top:2px}
  .ct-info .up{font-size:13px;color:var(--text-muted);margin-top:4px}
  .ct-qty{display:flex;align-items:center;border:1px solid rgba(0,0,0,.15);border-radius:var(--radius);overflow:hidden}
  .ct-qty button{width:34px;height:34px;background:#fff;border:none;font-size:18px;cursor:pointer;color:#111;font-family:inherit}
  .ct-qty button:hover{background:var(--gray-soft)}
  .ct-qty span{min-width:34px;text-align:center;font-weight:600;font-size:14px}
  .ct-line{font-weight:700;font-size:16px;color:#111;min-width:92px;text-align:right}
  .ct-rm{background:none;border:none;color:var(--border-hover);cursor:pointer;font-size:22px;line-height:1;padding:4px;font-family:inherit}
  .ct-rm:hover{color:#c0392b}
  .ct-empty{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:60px 24px;text-align:center}
  .ct-empty p{font-size:16px;color:rgba(0,0,0,.55);margin-bottom:20px}
  .ct-empty a{display:inline-block;background:var(--yellow);color:#111;font-weight:600;padding:13px 28px;border-radius:var(--radius);text-decoration:none}
  /* summary */
  .ct-sum{position:sticky;top:20px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:24px;display:flex;flex-direction:column;gap:16px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
  .ct-sum h3{font-weight:700;font-size:18px;color:#111}
  .ct-promo{display:flex;flex-direction:column;gap:8px}
  .ct-promo label{font-weight:600;font-size:13px;color:#111}
  .ct-promo .ip{display:flex;gap:8px}
  .ct-promo input{flex:1;border:1px solid rgba(0,0,0,.15);border-radius:var(--radius);padding:11px 14px;font-size:14px;font-family:inherit;text-transform:uppercase;outline:none}
  .ct-promo input:focus{border-color:#111}
  .ct-promo .apply{background:#111;color:#fff;border:none;border-radius:var(--radius);padding:0 18px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
  .ct-promo .msg{font-size:13px;font-weight:500}
  .ct-promo .msg.ok{color:#237a37} .ct-promo .msg.err{color:#c0392b}
  .ct-hint{font-size:12px;color:rgba(0,0,0,.45)}
  .ct-hint code{background:var(--gray-soft);padding:1px 6px;border-radius:3px;font-weight:700;color:#111}
  .ct-rows{display:flex;flex-direction:column;gap:10px;border-top:1px solid rgba(0,0,0,.08);padding-top:14px}
  .ct-rows .r{display:flex;justify-content:space-between;font-size:14px;color:rgba(0,0,0,.65)}
  .ct-rows .r b{font-weight:600;color:#111}
  .ct-rows .r.disc b{color:#237a37}
  .ct-tot{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--border);padding-top:14px}
  .ct-tot .l{font-weight:700;font-size:16px} .ct-tot .v{font-weight:700;font-size:26px;color:#111}
  .ct-checkout{background:var(--yellow);color:#111;border:none;border-radius:var(--radius);height:52px;font-weight:600;font-size:16px;cursor:pointer;font-family:inherit;transition:filter .2s}
  .ct-checkout:hover{filter:brightness(.93)}
  @media(max-width:900px){ .ct-body{grid-template-columns:1fr} .ct-sum{position:static} }
  @media(max-width:560px){ .ct-row{flex-wrap:wrap} .ct-line{min-width:auto} }
</style>
</head>
<body>

<div data-archi="nav"></div>

<section class="ct-page">
  <div class="inner">
    <nav class="ct-crumbs"><a href="index.html">Ana səhifə</a><span>/</span><span class="c2">Səbət</span></nav>
    <h1 class="ct-title">Səbətim</h1>
    <div class="ct-body">
      <div id="ctItems"></div>
      <aside class="ct-sum" id="ctSum"></aside>
    </div>
  </div>
</section>

<div data-archi="footer"></div>

<script>
const fmt=n=>Math.round(n).toLocaleString('ru-RU');
// promokodlar
const PROMOS={
  "ARCHI15":{type:"pct",val:0.15,label:"15% endirim"},
  "YENI10": {type:"pct",val:0.10,label:"10% endirim"},
  "QIS20":  {type:"pct",val:0.20,min:200,label:"20% endirim (min 200 ₼)"}
};
const DELIVERY_FREE=100, DELIVERY_FEE=10;

let cart=[]; try{ cart=JSON.parse(localStorage.getItem('archi-cart')||'[]'); }catch(e){}
cart=cart.map(c=>({qty:1,...c, qty:c.qty||1}));
let promo=null; try{ promo=(localStorage.getItem('archi-promo')||'')||null; }catch(e){}

function save(){ try{ localStorage.setItem('archi-cart',JSON.stringify(cart)); }catch(e){}
  const b=document.getElementById('navCartCount'); if(b){ if(cart.length){b.textContent=cart.length;b.style.display='flex';}else b.style.display='none'; } }
function subtotal(){ return cart.reduce((s,c)=>s+(+c.price||0)*(c.qty||1),0); }
function discount(){ if(!promo||!PROMOS[promo]) return 0; const p=PROMOS[promo]; const sub=subtotal(); if(p.min&&sub<p.min) return 0; return p.type==="pct"? sub*p.val : p.val; }

const itemsEl=document.getElementById('ctItems'), sumEl=document.getElementById('ctSum');

function renderItems(){
  if(!cart.length){
    itemsEl.innerHTML=`<div class="ct-empty"><p>Səbətiniz boşdur.</p><a href="index.html">Kampaniyalara bax</a></div>`;
    return;
  }
  itemsEl.className='ct-items';
  itemsEl.innerHTML=cart.map((c,i)=>`
    <div class="ct-row" data-i="${i}">
      <div class="ct-thumb"></div>
      <div class="ct-info"><b>${c.name}</b><div class="m">${(c.cat||'')}${c.brand?' · '+c.brand:''}</div><div class="up">Vahid qiymət: ${fmt(c.price)} ₼</div></div>
      <div class="ct-qty"><button data-a="dec">−</button><span>${c.qty}</span><button data-a="inc">+</button></div>
      <div class="ct-line">${fmt((+c.price||0)*(c.qty||1))} ₼</div>
      <button class="ct-rm" data-a="rm" title="Sil">×</button>
    </div>`).join('');
  itemsEl.querySelectorAll('.ct-row').forEach(row=>{
    const i=+row.dataset.i;
    row.querySelectorAll('[data-a]').forEach(btn=>btn.addEventListener('click',()=>{
      const a=btn.dataset.a;
      if(a==='inc') cart[i].qty++;
      else if(a==='dec') cart[i].qty=Math.max(1,cart[i].qty-1);
      else if(a==='rm') cart.splice(i,1);
      save(); render();
    }));
  });
}
function renderSum(){
  const sub=subtotal(), disc=discount();
  const afterDisc=sub-disc;
  const delivery = cart.length? (afterDisc>=DELIVERY_FREE?0:DELIVERY_FEE) : 0;
  const total=afterDisc+delivery;
  let msg='';
  if(promo){
    if(PROMOS[promo]){ const p=PROMOS[promo]; msg = (p.min&&sub<p.min)? `<div class="msg err">Kod ${promo}: minimum ${p.min} ₼ sifariş tələb olunur</div>` : `<div class="msg ok">✓ ${promo} tətbiq olundu — ${p.label}</div>`; }
    else msg=`<div class="msg err">Belə promokod yoxdur</div>`;
  }
  sumEl.innerHTML=`
    <h3>Sifariş xülasəsi</h3>
    <div class="ct-promo">
      <label>Promokod</label>
      <div class="ip"><input id="ctPromo" placeholder="ARCHI15" value="${promo||''}"><button class="apply" id="ctApply">Tətbiq et</button></div>
      ${msg}
      <div class="ct-hint">Sınayın: <code>ARCHI15</code> · <code>YENI10</code> · <code>QIS20</code></div>
    </div>
    <div class="ct-rows">
      <div class="r"><span>Ara cəm (${cart.reduce((s,c)=>s+c.qty,0)} məhsul)</span><b>${fmt(sub)} ₼</b></div>
      ${disc>0?`<div class="r disc"><span>Endirim (${promo})</span><b>− ${fmt(disc)} ₼</b></div>`:''}
      <div class="r"><span>Çatdırılma</span><b>${delivery?fmt(delivery)+' ₼':'Pulsuz'}</b></div>
    </div>
    <div class="ct-tot"><span class="l">Yekun</span><span class="v">${fmt(total)} ₼</span></div>
    <button class="ct-checkout" id="ctCheckout">Sifarişi rəsmiləşdir</button>`;
  const applyBtn=document.getElementById('ctApply'), inp=document.getElementById('ctPromo');
  if(applyBtn){
    const apply=()=>{ const code=(inp.value||'').trim().toUpperCase(); promo=code||null; try{localStorage.setItem('archi-promo',promo||'');}catch(e){} renderSum(); };
    applyBtn.addEventListener('click',apply);
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') apply(); });
  }
  const co=document.getElementById('ctCheckout'); if(co) co.addEventListener('click',()=>{ if(!cart.length){alert('Səbət boşdur.');return;} alert('Sifariş qəbul olundu! Yekun: '+fmt(total)+' ₼'); });
}
function render(){ renderItems(); renderSum(); }
save(); render();
</script>
<script src="archi.js"></script>
</body>
</html>
